name: Site - Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - docs-site # temporary, so the deployment can be verified before merging; remove after merging to main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'command-palette/README.md'
      - '.github/workflows/site-publish.yml'

# Required for actions/deploy-pages
permissions:
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run unit tests
      working-directory: site
      run: npm test

    - name: Build site
      working-directory: site
      run: npm run build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
