name: Site - Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
  push:
    branches:
      - main
      - docs-site
    paths:
      - 'site/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run unit tests
      working-directory: site
      run: npm test

    - name: Verify site build
      working-directory: site
      run: npm run build
